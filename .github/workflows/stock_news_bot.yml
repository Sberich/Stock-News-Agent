name: Stock News AI Agent

on:
  # รันวันละ 2 รอบ ตรงตามจังหวะตลาดหุ้นสหรัฐฯ (เวลา UTC ช้ากว่าไทย 7 ชั่วโมง)
  # 1) 13:00 UTC = 20:00 น. เวลาไทย (จันทร์-ศุกร์): สรุปข่าวเด่น Pre-Market ก่อนตลาดเปิด
  # 2) 00:00 UTC = 07:00 น. เวลาไทย (อังคาร-เสาร์): สรุป Morning Recap ตลาดปิดยามเช้า
  schedule:
    - cron: '0 13 * * 1-5'
    - cron: '0 0 * * 2-6'
  
  # เปิดให้สามารถกดปุ่ม "Run workflow" รันแบบ Manual ได้ตลอดเวลา
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Sent News Caches
        uses: actions/cache@v4
        with:
          path: |
            sent_news_cache.json
            sent_crypto_cache.json
            sent_gold_cache.json
          key: all-news-cache-${{ github.run_id }}
          restore-keys: |
            all-news-cache-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Run Crypto News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL_CRYPTO: ${{ secrets.DISCORD_WEBHOOK_URL_CRYPTO }}
        run: python crypto_agent.py

      - name: Run Gold News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL_GOLD: ${{ secrets.DISCORD_WEBHOOK_URL_GOLD }}
        run: python gold_agent.py

      - name: Run Market Data Agent (Morning Recap & Manual Only)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 2-6'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL_MARKET: ${{ secrets.DISCORD_WEBHOOK_URL_MARKET }}
        run: python market_agent.py
